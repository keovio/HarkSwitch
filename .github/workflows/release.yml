name: Package HarkSwitch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip extension
        run: |
          mkdir -p dist/HarkSwitch
          cp -r manifest.json popup.html popup.css popup.js core.js icons dist/HarkSwitch/
          cd dist && zip -r HarkSwitch.zip HarkSwitch
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(jq -r .version manifest.json)
          TAG="v${VER}-build${{ github.run_number }}"
          gh release create "$TAG" dist/HarkSwitch.zip \
            --title "HarkSwitch $TAG" \
            --notes "下载 HarkSwitch.zip 解压 → Chrome/Edge 打开 chrome://extensions → 右上角开「开发者模式」→「加载已解压的扩展程序」选解压出来的 HarkSwitch 文件夹。" \
            --latest
